name: Azure Postiz preflight

on:
  push:
    paths:
      - '.github/workflows/azure-postiz-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure credential secret exists
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::AZURE_CREDENTIALS is not configured in this repository."
            exit 2
          fi
          echo "AZURE_CREDENTIALS is configured."

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read-only subscription preflight
        shell: bash
        run: |
          az account show --query '{name:name,id:id,state:state,tenantId:tenantId,user:user.name}' -o json
          az group list --query '[].{name:name,location:location}' -o table
          echo "Preflight only: no Azure resources were created or modified."
